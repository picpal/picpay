# Required GitHub Actions Secrets:
# EC2_SSH_KEY       - PEM key file contents for SSH access
# EC2_HOST          - EC2-A public IP (updated by infra/start-ec2.sh)
# EC2_B_PRIVATE_IP  - EC2-B private IP (static, from infra/infra-ids.env)
# RDS_HOST          - RDS endpoint hostname
# DB_PASSWORD       - PostgreSQL master password
# JWT_SECRET        - JWT signing key (base64, min 32 bytes)
# VAULT_AES_KEY     - AES-256 encryption key (base64, 32 bytes)

name: CD

on:
  push:
    branches: [main]

env:
  EC2_USER: ubuntu

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build JARs
        run: ./gradlew bootJar -x test --no-daemon

      - name: Build WAS Docker images (parallel)
        run: |
          mkdir -p /tmp/images
          for svc in gateway payment billing token notification; do
            (docker build -f services/$svc/Dockerfile -t picpay-$svc:latest . \
              && docker save picpay-$svc:latest | gzip > /tmp/images/$svc.tar.gz \
              && echo "$svc done") &
          done
          wait
          echo "All images built and saved"

      - name: Pull and save middleware images
        run: |
          docker pull confluentinc/cp-zookeeper:7.5.0
          docker pull confluentinc/cp-kafka:7.5.0
          docker pull redis:7
          docker save confluentinc/cp-zookeeper:7.5.0 | gzip > /tmp/images/zookeeper.tar.gz
          docker save confluentinc/cp-kafka:7.5.0 | gzip > /tmp/images/kafka.tar.gz
          docker save redis:7 | gzip > /tmp/images/redis.tar.gz

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/picpay.pem
          chmod 600 ~/.ssh/picpay.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          # Copy PEM key to EC2-A so it can SSH into EC2-B (bastion relay)
          scp -i ~/.ssh/picpay.pem -o StrictHostKeyChecking=no \
            ~/.ssh/picpay.pem \
            $EC2_USER@${{ secrets.EC2_HOST }}:~/.ssh/picpay.pem
          ssh -i ~/.ssh/picpay.pem -o StrictHostKeyChecking=no \
            $EC2_USER@${{ secrets.EC2_HOST }} "chmod 600 ~/.ssh/picpay.pem"

      # ── EC2-B FIRST: Redis/Kafka must be ready before WAS services start ──

      - name: Copy middleware images to EC2-A (for relay to EC2-B)
        run: |
          scp -i ~/.ssh/picpay.pem -o StrictHostKeyChecking=no \
            /tmp/images/zookeeper.tar.gz \
            /tmp/images/kafka.tar.gz \
            /tmp/images/redis.tar.gz \
            $EC2_USER@${{ secrets.EC2_HOST }}:/tmp/

      - name: Copy docker-compose.ec2-b to EC2-A
        run: |
          scp -i ~/.ssh/picpay.pem -o StrictHostKeyChecking=no \
            deploy/docker-compose.ec2-b.yml \
            $EC2_USER@${{ secrets.EC2_HOST }}:/tmp/docker-compose.ec2-b.yml

      - name: Copy deploy script for EC2-B to EC2-A
        run: |
          scp -i ~/.ssh/picpay.pem -o StrictHostKeyChecking=no \
            infra/deploy-ec2-b.sh \
            $EC2_USER@${{ secrets.EC2_HOST }}:/tmp/deploy-ec2-b.sh

      - name: Relay middleware to EC2-B via EC2-A bastion and deploy
        run: |
          ssh -i ~/.ssh/picpay.pem -o StrictHostKeyChecking=no \
            $EC2_USER@${{ secrets.EC2_HOST }} bash <<REMOTE
            set -e
            EC2_B="${{ secrets.EC2_B_PRIVATE_IP }}"

            echo "Copying images and deploy script to EC2-B..."
            scp -i ~/.ssh/picpay.pem -o StrictHostKeyChecking=no \
              /tmp/zookeeper.tar.gz /tmp/kafka.tar.gz /tmp/redis.tar.gz \
              /tmp/docker-compose.ec2-b.yml /tmp/deploy-ec2-b.sh \
              ubuntu@\$EC2_B:/tmp/

            echo "Running deploy script on EC2-B..."
            ssh -i ~/.ssh/picpay.pem -o StrictHostKeyChecking=no ubuntu@\$EC2_B \
              "bash /tmp/deploy-ec2-b.sh"
          REMOTE

      - name: Wait for middleware to be ready
        run: |
          echo "Waiting for Kafka on EC2-B to be ready (up to 3min)..."
          for i in $(seq 1 18); do
            if ssh -i ~/.ssh/picpay.pem -o StrictHostKeyChecking=no \
              -o ConnectTimeout=5 $EC2_USER@${{ secrets.EC2_HOST }} \
              "ssh -i ~/.ssh/picpay.pem -o StrictHostKeyChecking=no \
               -o ConnectTimeout=5 ubuntu@${{ secrets.EC2_B_PRIVATE_IP }} \
               'docker exec kafka kafka-topics --bootstrap-server localhost:9092 --list' \
               2>/dev/null" 2>/dev/null; then
              echo "Kafka ready after ~$((i*10))s"
              break
            fi
            echo "Attempt $i/18: Kafka not ready, retrying in 10s..."
            sleep 10
          done

      # ── EC2-A SECOND: WAS services start after middleware is ready ──

      - name: Copy WAS images to EC2-A
        run: |
          scp -i ~/.ssh/picpay.pem -o StrictHostKeyChecking=no \
            /tmp/images/gateway.tar.gz \
            /tmp/images/payment.tar.gz \
            /tmp/images/billing.tar.gz \
            /tmp/images/token.tar.gz \
            /tmp/images/notification.tar.gz \
            $EC2_USER@${{ secrets.EC2_HOST }}:/tmp/

      - name: Copy docker-compose to EC2-A
        run: |
          scp -i ~/.ssh/picpay.pem -o StrictHostKeyChecking=no \
            deploy/docker-compose.ec2-a.yml \
            $EC2_USER@${{ secrets.EC2_HOST }}:/home/ubuntu/docker-compose.yml

      - name: Deploy WAS services on EC2-A
        run: |
          ssh -i ~/.ssh/picpay.pem -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            $EC2_USER@${{ secrets.EC2_HOST }} bash <<'REMOTE'
            set -e
            echo "Stopping old containers to free memory before loading new images..."
            docker compose -f /home/ubuntu/docker-compose.yml down 2>/dev/null || \
              docker stop $(docker ps -q) 2>/dev/null || true
            echo "Cleaning up old Docker images..."
            docker system prune -f
            for svc in gateway payment billing token notification; do
              echo "Loading $svc image..."
              docker load < /tmp/${svc}.tar.gz
            done
            echo "Starting WAS services..."
            RDS_HOST=${{ secrets.RDS_HOST }} \
            DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            JWT_SECRET=${{ secrets.JWT_SECRET }} \
            VAULT_AES_KEY=${{ secrets.VAULT_AES_KEY }} \
            EC2_B_PRIVATE_IP=${{ secrets.EC2_B_PRIVATE_IP }} \
            docker compose up -d --remove-orphans
          REMOTE

      - name: Health check
        run: |
          echo "Waiting for WAS services to be ready (up to 5min)..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 \
              http://${{ secrets.EC2_HOST }}:8080/actuator/health 2>/dev/null)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed after ~$((i*10))s: HTTP $STATUS"
              exit 0
            fi
            echo "Attempt $i/30: HTTP ${STATUS:-timeout}, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 5 minutes"
          exit 1
